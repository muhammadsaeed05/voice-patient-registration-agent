[project]
name = "voice-patient-registration-agent"
version = "0.1.0"
description = "Production Voice AI Agent Patient Registration Backend API"
readme = "README.md"
authors = [
    { name = "Muhammad Saeed", email = "saeedsaleem.04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
voice-patient-registration-agent = "app.main:start"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
